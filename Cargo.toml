[workspace]
resolver = "3"
members = ["u50_check", "u50_cli", "u50_style", "u50_submit"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
git2 = { version = "0.21", features = ["ssh"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
similar = { version = "2", features = ["inline"] }
serde_json = "1"
indicatif = "0.17"
uv-python = "=0.0.74"
uv-virtualenv = "=0.0.74"
uv-installer = "=0.0.74"


[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
