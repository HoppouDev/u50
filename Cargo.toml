[workspace]
resolver = "3"
members = ["u50_check", "u50_cli", "u50_style", "u50_submit"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
git2 = { version = "0.21", features = ["ssh"] }
tokio = { version = "1", features = ["all"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
