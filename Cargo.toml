[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["color", "derive"] }
crossterm = { version = "0.29.0", default-features = false, features = ["windows"] }
dirs = "7.0.0"
fs-err = "3.3.1"
fslock = "0.2.1"
git2 = { version = "0.21.0", features = ["ssh"] }
include_dir = "0.7.4"
indicatif = "0.18.6"
inventory = "0.3.24"
leptos = "0.8.20"
libc = "0.2.189"
rand = "0.10.2"
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "json", "rustls", "system-proxy"] }
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = { version = "3.2.0", features = ["inline"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-width = "0.2.2"
walkdir = "2.5.0"
which = "8.0.6"

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
