name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Golden tests (dogfood `u50 --setup`; byte-compare against style50 3.0.0 ground truth)
        # Ubuntu-only: djhtml (html) and the SQL backend produce byte-different
        # output on Windows (observed in CI: html_golden, sql_golden, and
        # expected-fixture-clean failures while c/cpp/java/py/js pass).
        # Byte-parity is enforced on ubuntu; policy in docs/windows-support.md
        # Phase 2.
        if: runner.os == 'Linux'
        # U50_STYLE_GOLDEN is set via env: instead of an inline `VAR=1 cmd` prefix
        # because the inline prefix is bash-only and breaks under pwsh, the default
        # shell on windows-latest.
        env:
          U50_STYLE_GOLDEN: "1"
        run: |
          cargo run -q --bin u50 -- --setup
          cargo test -p u50_style --test golden --release
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --verbose --all-targets -- -Dwarnings

  harness:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: paladini/harness-score@v1
        with:
          min-level: '4'
          badge: 'harness-badge.svg'
      - name: Publish badge (badges branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          # Stash the freshly generated badge before switching branches:
          # if `badges` already tracks harness-badge.svg, the checkout
          # below would refuse to clobber the untracked workspace copy.
          cp "$GITHUB_WORKSPACE/harness-badge.svg" "$RUNNER_TEMP/harness-badge.svg"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin badges || true
          git checkout -B badges origin/badges 2>/dev/null || git checkout --orphan badges
          git rm -rf --quiet . 2>/dev/null || true
          cp "$RUNNER_TEMP/harness-badge.svg" harness-badge.svg
          git add harness-badge.svg
          git commit -m "chore: update harness badge [skip ci]" || echo "badge unchanged"
          git push -u origin badges
