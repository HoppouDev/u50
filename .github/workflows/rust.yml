name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Golden tests (dogfood `u50 --setup`; byte-compare against style50 3.0.0 ground truth)
      run: |
        cargo run -q --bin u50 -- --setup
        U50_STYLE_GOLDEN=1 cargo test -p u50_style --test golden --release
    - name: Format
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy --verbose --all-targets -- -Dwarnings
    - name: Harness gate
      run: npx -y harness-score --min-level 3
