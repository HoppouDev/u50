name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Cache u50 style formatter cache
        # The golden step's `u50 --setup` provisions a uv-managed CPython
        # plus six pinned backends into this cache; its contents are fully
        # determined by tests/tool-versions.txt, so key on that hash.
        if: runner.os == 'Linux'
        uses: actions/cache@1bd1e32a3bdc45362d1a799c8c9d3fb16c3df0b1 # v4
        with:
          path: ~/.cache/u50/style50
          key: u50-style-cache-${{ runner.os }}-${{ hashFiles('u50_style/tests/tool-versions.txt') }}
          restore-keys: u50-style-cache-${{ runner.os }}-
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Golden tests (dogfood `u50 --setup`; byte-compare against style50 3.0.0 ground truth)
        # Ubuntu-only: djhtml (html) and the SQL backend produce byte-different
        # output on Windows (observed in CI: html_golden, sql_golden, and
        # expected-fixture-clean failures while c/cpp/java/py/js pass), so
        # byte-parity is enforced on ubuntu only; re-enable the step on
        # windows-latest once those backends are byte-stable there.
        if: runner.os == 'Linux'
        # U50_STYLE_GOLDEN is set via env: instead of an inline `VAR=1 cmd` prefix
        # because the inline prefix is bash-only and breaks under pwsh, the default
        # shell on windows-latest.
        env:
          U50_STYLE_GOLDEN: "1"
        run: |
          cargo run -q --bin u50 -- --setup
          cargo test -p u50_style --test golden --release
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --verbose --all-targets -- -Dwarnings

  harness:
    # Badge publishing needs contents:write — scope the whole job to the
    # push run that publishes it instead of running it (write-scoped) on
    # every pull_request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: paladini/harness-score@51dcaba93c176f149a0e4a58d23e867bac63f9fc # v1
        with:
          min-level: "4"
          badge: "harness-badge.svg"
      - name: Publish badge (badges branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          # Stash the freshly generated badge to $RUNNER_TEMP, then REMOVE the
          # workspace copy: `git checkout -B badges` refuses to overwrite
          # untracked files, so a leftover workspace harness-badge.svg would
          # make the checkout fail.
          cp "$GITHUB_WORKSPACE/harness-badge.svg" "$RUNNER_TEMP/harness-badge.svg"
          rm -f "$GITHUB_WORKSPACE/harness-badge.svg"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Explicit refspec: a shallow single-branch clone does not create
          # refs/remotes/origin/badges from a bare `git fetch origin badges`.
          git fetch origin +refs/heads/badges:refs/remotes/origin/badges || true
          if git rev-parse -q --verify refs/remotes/origin/badges >/dev/null; then
            git checkout -B badges refs/remotes/origin/badges
          else
            git checkout --orphan badges
            git rm -rf --quiet . 2>/dev/null || true
          fi
          cp "$RUNNER_TEMP/harness-badge.svg" harness-badge.svg
          git add harness-badge.svg
          git commit -m "chore: update harness badge [skip ci]" || echo "badge unchanged"
          # Force: the badges branch is bot-owned and badge-only, so a force
          # push is safe and makes the step idempotent (no non-fast-forward
          # rejection from the orphan fallback or concurrent runs).
          git push --force -u origin badges
