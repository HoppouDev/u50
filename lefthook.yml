# Fast feedback before a commit exists: formatting and lint gates.
# Install once per clone:  lefthook install
pre-commit:
  commands:
    fmt-check:
      run: cargo fmt --all -- --check
    clippy:
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets -- -Dwarnings
    prettier:
      glob: "*.{md,yml,yaml,json}"
      stage_fixed: true
      run: prettier --write {staged_files}
    toml-format:
      glob: "*.toml"
      stage_fixed: true
      run: tombi format {staged_files}
