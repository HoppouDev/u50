---
pre-commit:
  parallel: true
  commands:
    tombi-format:
      glob: "*.toml"
      run: tombi format
      stage_fixed: true

    cargo-fmt:
      glob: "*.rs"
      run: cargo fmt
      stage_fixed: true

    prettier:
      run: prettier . -w
      stage_fixed: true

    clippy:
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets -- -D warnings
